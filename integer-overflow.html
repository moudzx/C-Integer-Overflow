<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive demo of x86 overflow flags (CF, OF, SF, ZF) for 8, 16 and 32 bit signed and unsigned integer arithmetic.">
<title>x86 Overflow-Aware Arithmetic demo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#dedacd;--card:#d2cdbe;--border:rgba(30,28,18,.18);--text:#1f1e18;--muted:#5e5946;--accent:#8a7250;--on:#1f1e18;--onfg:#dedacd;--bad:#a63d2f;--good:#3f6b45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2c31;--card:#3c3d44;--border:rgba(255,255,255,.16);--text:#f5f5f0;--muted:#b0aea4;--accent:#c8c0b0;--on:#f5f5f0;--onfg:#2b2c31;--bad:#e07a6a;--good:#8cc796}}
:root[data-theme="dark"]{--bg:#2b2c31;--card:#3c3d44;--border:rgba(255,255,255,.16);--text:#f5f5f0;--muted:#b0aea4;--accent:#c8c0b0;--on:#f5f5f0;--onfg:#2b2c31;--bad:#e07a6a;--good:#8cc796}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-weight:300;line-height:1.5;padding:28px 20px 48px}
main{max-width:760px;margin:0 auto}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:clamp(32px,7vw,48px);letter-spacing:-.01em;padding-right:44px}
.sub{color:var(--muted);margin:6px 0 24px;font-size:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:6px}
button{font:inherit;font-weight:400;font-size:14px;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:999px;padding:7px 14px;cursor:pointer;transition:border-color .2s,background .2s}
button:hover{border-color:var(--accent)}
button.sel{background:var(--on);color:var(--onfg);border-color:var(--on)}
.val{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(46px,12vw,78px);line-height:1.05;margin:4px 0;word-break:break-all;transition:color .3s}
.val.flash{color:var(--bad)}
.meta{display:flex;flex-wrap:wrap;gap:6px 24px;color:var(--muted);font-size:13px;font-family:ui-monospace,Menlo,monospace}
.flags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.flag{font-family:ui-monospace,Menlo,monospace;font-size:13px;border:1px solid var(--border);border-radius:999px;padding:4px 12px}
.flag.on{background:var(--on);color:var(--onfg);border-color:var(--on)}
.flag.hot{background:var(--bad);border-color:var(--bad);color:#fff}
.flag.rel{outline:1px dashed var(--accent);outline-offset:2px}
.hint{font-size:12px;color:var(--muted);margin-left:4px}
.bits{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
.bit{width:26px;height:34px;padding:0;border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-size:14px;display:flex;align-items:center;justify-content:center}
.bit.on{background:var(--on);color:var(--onfg);border-color:var(--on)}
.bit.sign{outline:1px dashed var(--accent);outline-offset:2px}
.log{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:44px}
.log .bad{color:var(--bad)}.log .ok{color:var(--good)}
.snip{font-family:ui-monospace,Menlo,monospace;font-size:13px;white-space:pre;overflow-x:auto}
input{font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:7px 14px;width:130px}
</style>
</head>
<body>
<main>
<h1 style="padding-right:0">x86 overflow flags</h1>
<p class="sub">Run add, sub, mul and neg on 8, 16 and 32 bit registers. CF flags unsigned overflow, OF flags signed overflow.</p>

<div class="card">
<div class="row"><span class="lbl">Register</span><span id="widths" class="row"></span><span class="lbl" style="margin-left:14px">Type</span><span id="types" class="row"></span></div>
</div>

<div class="card">
<div class="lbl">AL / AX / EAX</div>
<div id="val" class="val">0</div>
<div class="meta"><span id="hex"></span><span id="raw"></span><span id="wraps"></span></div>
<div class="flags" id="flags"></div>
<div id="bits" class="bits"></div>
</div>

<div class="card">
<div class="row"><span class="lbl">Operand</span><input id="operand" type="number" value="1" step="1"></div>
<div class="row" style="margin-top:10px">
<button data-op="add">add</button>
<button data-op="sub">sub</button>
<button data-op="mul">mul</button>
<button data-op="neg">neg</button>
<button data-op="max">set MAX</button>
<button data-op="min">set MIN</button>
<button data-op="zero">reset</button>
</div>
</div>

<div class="card"><div class="lbl">Last operation</div><div id="log" class="log"></div></div>

<div class="card"><div class="lbl">Assembly</div><div id="snip" class="snip"></div></div>
</main>
<script>
const S={n:8,signed:true,u:127n,wraps:0,fl:{CF:0,OF:0,SF:0,ZF:0}};
const REG={8:["al","bl"],16:["ax","bx"],32:["eax","ebx"]};
const $=id=>document.getElementById(id);
const mod=()=>1n<<BigInt(S.n);
const smin=()=>-(1n<<BigInt(S.n-1));
const smax=()=>(1n<<BigInt(S.n-1))-1n;
const lo=()=>S.signed?smin():0n;
const hi=()=>S.signed?smax():mod()-1n;
const toVal=u=>S.signed&&u>=(1n<<BigInt(S.n-1))?u-mod():u;
const toRaw=v=>((v%mod())+mod())%mod();
const inS=x=>x>=smin()&&x<=smax();
const fmt=v=>v.toString();
const jmp=()=>S.signed?"jo":"jc";
const clearFlags=()=>{S.fl={CF:0,OF:0,SF:0,ZF:0}};

function run(op){
  const txt=$("operand").value.trim();
  if(!/^-?\d+$/.test(txt))return;
  const a=S.u,b=toRaw(BigInt(txt)),sa=toVal(a),sb=toVal(b);
  const M=mod(),top=1n<<BigInt(S.n-1),sv=x=>x>=top?x-M:x;
  let res,cf,of;
  if(op==="add"){res=(a+b)%M;cf=a+b>=M;of=!inS(sv(a)+sv(b))}
  else if(op==="sub"){res=toRaw(a-b);cf=a<b;of=!inS(sv(a)-sv(b))}
  else if(op==="mul"){
    if(S.signed){const f=sa*sb;res=toRaw(f);cf=of=!inS(f)}
    else{const f=a*b;res=f%M;cf=of=f>=M}
  }
  else{res=toRaw(-a);cf=a!==0n;of=a===top}
  S.u=res;
  S.fl={CF:cf?1:0,OF:of?1:0,SF:Number((res>>BigInt(S.n-1))&1n),ZF:res===0n?1:0};
  const hit=S.signed?of:cf;
  if(hit)S.wraps++;
  const r=REG[S.n],mn=(op==="mul"?(S.signed?"imul":"mul"):op);
  const line=op==="neg"?`${mn} ${r[0]}`:op==="mul"?`${mn} ${r[1]}`:`${mn} ${r[0]}, ${r[1]}`;
  const setup=`mov ${r[0]}, ${fmt(toVal(a))}`+(op==="neg"?"":`\nmov ${r[1]}, ${fmt(toVal(b))}`);
  $("snip").textContent=`${setup}\n${line}\n${jmp()} overflow`;
  const f=S.fl;
  $("log").innerHTML=`${mn} ${fmt(toVal(a))}${op==="neg"?"":", "+fmt(toVal(b))} = ${fmt(toVal(res))}<br>CF=${f.CF} OF=${f.OF} SF=${f.SF} ZF=${f.ZF}<br>`+
    (hit?`<span class="bad">${jmp()} taken: ${S.signed?"signed":"unsigned"} overflow</span>`:`<span class="ok">${jmp()} not taken</span>`);
  render(hit);
}

function render(flash){
  const v=toVal(S.u);
  $("val").textContent=fmt(v);
  $("val").classList.toggle("flash",!!flash);
  if(flash)setTimeout(()=>$("val").classList.remove("flash"),600);
  $("hex").textContent="0x"+S.u.toString(16).toUpperCase().padStart(S.n/4,"0");
  $("raw").textContent="range ["+fmt(lo())+", "+fmt(hi())+"]";
  $("wraps").textContent="overflows "+S.wraps;
  const rel=S.signed?"OF":"CF";
  $("flags").innerHTML=["CF","OF","SF","ZF"].map(k=>`<span class="flag${S.fl[k]?" on":""}${k===rel&&S.fl[k]?" hot":""}${k===rel?" rel":""}">${k} ${S.fl[k]}</span>`).join("")+`<span class="hint">dashed: flag that ${jmp()} tests</span>`;
  const bits=$("bits");bits.innerHTML="";
  for(let b=S.n-1;b>=0;b--){
    const on=(S.u>>BigInt(b))&1n;
    const el=document.createElement("button");
    el.className="bit"+(on?" on":"")+(S.signed&&b===S.n-1?" sign":"");
    el.textContent=on?"1":"0";
    el.title="bit "+b;
    el.onclick=()=>{S.u^=1n<<BigInt(b);clearFlags();render(false);$("log").textContent="bit "+b+" flipped"};
    bits.appendChild(el);
  }
}

function opts(id,list,cur,set){
  const box=$(id);box.innerHTML="";
  list.forEach(([label,val])=>{
    const b=document.createElement("button");
    b.textContent=label;b.className=val===cur?"sel":"";
    b.onclick=()=>{set(val);init()};
    box.appendChild(b);
  });
}

function init(){
  opts("widths",[["8 bit",8],["16 bit",16],["32 bit",32]],S.n,n=>{S.n=n;S.u=toRaw(toVal(S.u));S.wraps=0});
  opts("types",[["signed",true],["unsigned",false]],S.signed,s=>{const v=toVal(S.u);S.signed=s;S.u=toRaw(v);S.wraps=0});
  S.u=toRaw(toVal(S.u));
  clearFlags();
  $("log").textContent="Pick an operation.";
  $("snip").textContent="";
  render(false);
}

document.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>{
  const op=b.dataset.op;
  if(op==="max"){S.u=toRaw(hi());clearFlags();$("log").textContent="set to MAX";render(false)}
  else if(op==="min"){S.u=toRaw(lo());clearFlags();$("log").textContent="set to MIN";render(false)}
  else if(op==="zero"){S.u=0n;S.wraps=0;clearFlags();$("log").textContent="reset";render(false)}
  else run(op);
});
init();
</script>
</body>
</html>
